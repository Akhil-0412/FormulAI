name: F1 Podium Predictor Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit the JSON files back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.14"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Match your project version

      - name: Install Dependencies
        run: uv sync

      # The DB is the expensive part (a full 2014→now ingest is ~1,500 rate-
      # limited API calls), so it's cached and topped up incrementally.
      # "v2" invalidates caches written before the Jolpica pagination fix,
      # which hold only ~5 races per season — incremental ingest would
      # otherwise treat those truncated seasons as complete.
      # Model artifacts are NOT cached: a restored cache would overwrite the
      # checked-out models, and the pipeline retrains every run anyway.
      - name: Cache Database
        uses: actions/cache@v4
        with:
          path: |
            data/db/
            data/cache/
          key: ${{ runner.os }}-f1-data-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-f1-data-v2-

      - name: Ingest Latest Data
        run: uv run python scripts/ingest_historical.py --start-year 2014 --latest --incremental

      - name: Ingest Race Weather
        run: uv run python scripts/ingest_weather.py --start-year 2014 --end-year "$(date +%Y)"

      - name: Run Automated Pipeline
        run: uv run python scripts/automated_pipeline.py

      # Guards against shipping a model that scores worse than simply picking
      # the three fastest qualifiers, on the current season's out-of-sample
      # (walk-forward) picks. Warn-only: early in a season there are too few
      # races for a hard gate not to flap on noise.
      - name: Check Model Beats Qualifying Baseline
        run: uv run python scripts/check_baseline.py --warn-only

      - name: Commit Updated Predictions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/latest_prediction.json \
                  data/rolling_backtest_*.json \
                  frontend/public/data/rolling_backtest_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update F1 predictions & backtest data [skip ci]"
            git pull --rebase
            git push
          fi
