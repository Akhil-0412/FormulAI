name: F1 Podium Predictor Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit the JSON files back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.14"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Match your project version

      - name: Install Dependencies
        run: uv sync

      - name: Cache Database and Features
        uses: actions/cache@v3
        with:
          path: |
            data/db/
            data/cache/
            data/feature_cache/
            models_v2/artifacts/
          key: ${{ runner.os }}-f1-data-${{ hashFiles('scripts/ingest_historical.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-f1-data-

      - name: Ingest Latest Data
        run: uv run python scripts/ingest_historical.py --start-year 2014 --latest

      - name: Run Automated Pipeline
        run: uv run python scripts/automated_pipeline.py

      - name: Commit Updated Predictions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/data/latest_prediction.json data/rolling_backtest_*.json
          git commit -m "Auto-update F1 predictions & backtest data [skip ci]" || echo "No changes to commit"
          git push
