auxiliary_heads:
  dnf_head:
    enabled: true
    learning_rate: 0.05
    max_depth: 4
    n_estimators: 200
  pace_head:
    enabled: true
    learning_rate: 0.05
    max_depth: 6
    n_estimators: 250
calibration:
  method: isotonic
  temporal_split: true
cross_validation:
  n_splits: 3
  strategy: temporal
data:
  db_path: data/db/race_history.db
  feature_cache_dir: data/feature_cache
  test_year: 2026
  train_end_year: 2024
  train_start_year: 2022
  val_year: 2025
elo:
  base_rating: 1500
  k_decay_races: 40
  k_max: 48
  k_min: 16
experiment:
  name: ltr_v3
  output_dir: reports/experiments
  save_model_metadata: true
  tags:
  - production
  - ltr
  - lambdamart
  - calibrated
ltr:
  ensemble:
    blend_weight_xgb: 0.5
    softmax_temperature: 3.0
  lgb_ranker:
    colsample_bytree: 0.8
    learning_rate: 0.05
    max_depth: 6
    metric: ndcg
    min_child_samples: 10
    n_estimators: 500
    ndcg_eval_at:
    - 3
    - 5
    objective: lambdarank
    reg_alpha: 0.1
    reg_lambda: 1.0
    subsample: 0.8
  xgb_ranker:
    colsample_bytree: 0.8
    lambdarank_num_pair_per_sample: 8
    lambdarank_pair_method: topk
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 3
    n_estimators: 500
    objective: rank:ndcg
    reg_alpha: 0.1
    reg_lambda: 1.0
    subsample: 0.8
    tree_method: hist
models:
  ltr_ranker:
    best_params_lgb:
      colsample_bytree: 0.7067939865838003
      learning_rate: 0.022798856288136143
      max_depth: 6
      min_child_samples: 27
      n_estimators: 69
      num_leaves: 50
      reg_alpha: 4.91655924709587
      reg_lambda: 0.003706445086166402
      subsample: 0.7898981409719577
    best_params_xgb:
      colsample_bytree: 0.8970378479377928
      lambdarank_num_pair_per_sample: 1
      learning_rate: 0.17546238917458828
      max_depth: 4
      min_child_weight: 4
      n_estimators: 238
      reg_alpha: 0.6853525040841771
      reg_lambda: 0.06524572071374668
      subsample: 0.7545411580325642
    blend_weight_xgb: 0.27764216408014086
optimization:
  enabled: true
  engine: optuna
  n_trials: 30
  timeout_seconds: 600
random_seed: 42
podium_model:
  # v4 production model (models_v2/podium_predictor.py). Members were chosen
  # by the walk-forward lab (scripts/model_lab.py, reports/model_lab/):
  # lowest 2022-2024 podium log-loss with podium hits no worse than the
  # regime's baseline, confirmed on held-out 2025-2026. Training from 2014
  # beat 2018 and 2022 starts on both validation and held-out seasons.
  train_start_year: 2014
  members:
    post: [xgb_rank_top10, lgb_podium_clf, base_grid]
    pre: [xgb_rank_top10, base_season_points]
